name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Tests en Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v7
      - name: Tests
        run: swift test --parallel 2>&1 | tee build.log
      - name: Sin avisos del compilador
        run: '! grep -E "warning:" build.log'

  macos:
    name: Tests en macOS
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Versiones
        id: versiones
        run: |
          swift --version
          echo "swift=$(swift --version 2>&1 | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - name: Caché de SwiftPM
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ steps.versiones.outputs.swift }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
      - name: Tests
        run: swift test --parallel
